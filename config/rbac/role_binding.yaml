# RoleBinding (not ClusterRoleBinding): binding manager-role (a ClusterRole)
# via a namespaced RoleBinding restricts its namespace-scoped permissions
# (Secrets, Jobs, Deployments, etc.) to the operator's own namespace.
# Cluster-scoped resources (StorageClass, ConsoleLink) require a separate
# ClusterRoleBinding — see cluster_access_role_binding.yaml.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    app.kubernetes.io/name: koku-service-operator
    app.kubernetes.io/managed-by: kustomize
  name: manager-rolebinding
  namespace: system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: manager-role
subjects:
- kind: ServiceAccount
  name: controller-manager
  namespace: system

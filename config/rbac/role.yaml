# ClusterRole: contains ONLY truly cluster-scoped resources.
# Namespace-scoped resources (Secrets, Jobs, Deployments, etc.) are in
# namespace_role.yaml, bound via a namespaced RoleBinding so the operator
# cannot read or write those resources outside its own namespace.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
# Operator's own CRD — Namespaced resource but listed in ClusterRole so the
# controller can watch it in its restricted namespace without needing a
# separate Role per possible namespace.
- apiGroups:
  - service.costmanagement.openshift.io
  resources:
  - costmanagementserviceconfigs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - service.costmanagement.openshift.io
  resources:
  - costmanagementserviceconfigs/finalizers
  verbs:
  - update
- apiGroups:
  - service.costmanagement.openshift.io
  resources:
  - costmanagementserviceconfigs/status
  verbs:
  - get
  - patch
  - update
# Cluster-scoped: OpenShift cluster config (discovery phase).
- apiGroups:
  - config.openshift.io
  resources:
  - ingresses
  verbs:
  - get
# Cluster-scoped: default StorageClass detection (discovery phase).
- apiGroups:
  - storage.k8s.io
  resources:
  - storageclasses
  verbs:
  - get
  - list
# Cluster-scoped: ConsoleLink for Application Menu entry.
- apiGroups:
  - console.openshift.io
  resources:
  - consolelinks
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
# Cluster-scoped: Kruize ClusterRole + ClusterRoleBinding (workload monitoring).
# list/watch are omitted: the operator uses server-side apply (Patch) to
# reconcile these resources, and Get is sufficient for the deletion path.
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - clusterroles
  - clusterrolebindings
  verbs:
  - create
  - delete
  - get
  - patch
  - update
